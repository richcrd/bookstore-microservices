name: bookstore-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  catalog:
    build:
      context: ..
      dockerfile: docker/Catalog/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:5038
      ConnectionStrings__CatalogDb: Host=postgres;Port=5432;Database=catalog_db;Username=postgres;Password=postgres
      OpenIddict__Issuer: ${BOOKSTORE_PUBLIC_ISSUER:-http://auth:5100}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  orders:
    build:
      context: ..
      dockerfile: docker/Orders/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:5248
      ConnectionStrings__OrdersDb: Host=postgres;Port=5432;Database=orders_db;Username=postgres;Password=postgres
      RabbitMQ__Host: rabbitmq://rabbitmq
      CatalogApi__BaseAddress: http://catalog:5038
      OpenIddict__Issuer: ${BOOKSTORE_PUBLIC_ISSUER:-http://auth:5100}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  inventory:
    build:
      context: ..
      dockerfile: docker/Inventory/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:5208
      ConnectionStrings__InventoryDb: Host=postgres;Port=5432;Database=inventory_db;Username=postgres;Password=postgres
      RabbitMQ__Host: rabbitmq://rabbitmq
      OpenIddict__Issuer: ${BOOKSTORE_PUBLIC_ISSUER:-http://auth:5100}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  auth:
    build:
      context: ..
      dockerfile: docker/Auth/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:5100
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=auth_db;Username=postgres;Password=postgres
      OpenIddict__Issuer: ${BOOKSTORE_PUBLIC_ISSUER:-http://auth:5100}
      OpenIddict__DisableTransportSecurityRequirement: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  sagaworker:
    build:
      context: ..
      dockerfile: docker/OrderSaga/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__OrderSagaDb: Host=postgres;Port=5432;Database=order_saga_db;Username=postgres;Password=postgres
      RabbitMQ__Host: rabbitmq://rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  apigateway:
    build:
      context: ..
      dockerfile: docker/ApiGateway/Dockerfile
    ports:
      - "80:5080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OpenIddict__Issuer: ${BOOKSTORE_PUBLIC_ISSUER:-http://auth:5100}
      OpenIddict__DisableTransportSecurityRequirement: "true"
      ReverseProxy__Clusters__catalog__Destinations__catalog-1__Address: http://catalog:5038/
      ReverseProxy__Clusters__orders__Destinations__orders-1__Address: http://orders:5248/
      ReverseProxy__Clusters__inventory__Destinations__inventory-1__Address: http://inventory:5208/
      ReverseProxy__Clusters__auth__Destinations__auth-1__Address: http://auth:5100/

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config", "/etc/otelcol/config.yml"]
    depends_on:
      - jaeger
      - seq
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GRAFANA_ALERT_WEBHOOK_URL=${GRAFANA_ALERT_WEBHOOK_URL:-http://host.docker.internal:3001/hooks/none}

volumes:
  pgdata:
  seq-data:
  prometheus-data:
  grafana-data: